[package]
name = "neurosight-app"
version.workspace = true
edition.workspace = true
description = "NeuroSight command-line app: webcam in, text out"

[[bin]]
name = "neurosight"
path = "src/main.rs"

[dependencies]
neurosight-common = { path = "../common" }
neurosight-capture = { path = "../capture" }
neurosight-events = { path = "../events" }
neurosight-perception = { path = "../perception" }
neurosight-encoder = { path = "../encoder" }
neurosight-receiver-sim = { path = "../receiver-sim" }
minifb = "0.28"
font8x8 = "0.3"
